<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OMNI-REAPER | SATURATION SLAYER</title>
<style>
 :root { --p: #007aff; --b: #ff3b30; --n: #00fff2; --g: #ffcc00; --bg: #000; --r: #ff0055; }
 * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
 body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', sans-serif; margin: 0; padding: 10px; overflow: hidden; }
 .shell { max-width: 420px; margin: auto; border: 1px solid #1a1a1a; border-radius: 40px; padding: 25px; background: #050505; position: relative; box-shadow: 0 0 60px rgba(0, 255, 242, 0.05); }
 
 .monitor { text-align: center; border-bottom: 1px solid #111; padding-bottom: 15px; margin-bottom: 15px; }
 #sig { font-size: 70px; font-weight: 950; height: 90px; display: flex; align-items: center; justify-content: center; letter-spacing: -4px; }
 
 .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
 .db-item { padding: 8px; font-size: 9px; font-weight: 900; background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 10px; text-transform: uppercase; color: #555; }

 .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; position: relative; z-index: 10000; }
 .btn-k { border: none; height: 100px; border-radius: 25px; font-size: 45px; font-weight: 900; color: #fff; cursor: pointer; border-bottom: 8px solid rgba(0,0,0,0.5); }
 .btn-p { background: var(--p); } .btn-b { background: var(--b); }
 .btn-k:active { transform: translateY(4px); border-bottom-width: 2px; }

 .h-row { display: flex; gap: 6px; overflow-x: auto; padding: 15px 0; border-bottom: 1px solid #111; }
 .node { min-width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; border: 1px solid #222; }
 .meta-line { display: flex; justify-content: space-between; margin-top: 15px; font-size: 11px; font-weight: 900; color: #333; }
</style>
</head>
<body>
<div class="shell">
 <div style="text-align:center; font-size:8px; color:var(--n); letter-spacing:10px; margin-bottom:12px; font-weight:bold;">OMNI-REAPER V.ULTIMATE</div>
 
 <div class="monitor">
  <div class="dashboard">
   <div id="sat-ui" class="db-item">SATURATION: 0%</div>
   <div id="chaos-ui" class="db-item">CHAOS INDEX: 0%</div>
  </div>
  <div id="sig" style="color:#111;">WAIT</div>
  <div id="prob" style="font-size:45px; font-weight:900; color:var(--n);">0.0%</div>
  <div id="intel" style="font-size:11px; color:var(--g); margin-top:8px; font-weight:bold;">AWAITING SIGNAL...</div>
 </div>

 <div class="btn-grid">
  <button class="btn-k btn-p" onpointerdown="cmd('P')">P</button>
  <button class="btn-k btn-b" onpointerdown="cmd('B')">B</button>
 </div>

 <div class="h-row" id="h-box"></div>

 <div class="meta-line">
  <span id="w-ui">WINS: 0</span>
  <span id="recall-ui" style="color:var(--n)">RECALL: 0</span>
  <span id="net-ui" style="color:var(--g)">NET: 0</span>
 </div>
 
 <div style="display:flex; justify-content:space-between; margin-top:20px; font-size:10px; color:#222;">
  <span onclick="undo()" style="cursor:pointer; padding:5px;">[ UNDO ]</span>
  <span onclick="location.reload()" style="cursor:pointer; padding:5px; color:var(--b);">[ RESET ]</span>
 </div>
</div>

<script>
let arch=[]; let wins=0, loss=0, net=0, streakL=0, nextMove=null;
let streaksHistory = [];

function cmd(s){
 if(nextMove){
  if(nextMove===s){ wins++; net++; streakL=0; }
  else { loss++; net--; streakL++; }
 }
 arch.push(s); ui(); engine();
}

function engine(){
 const len=arch.length; if(len<8) return;
 
 // 1. วิเคราะห์ความยาวมังกรเฉลี่ย (Mean Streak Analysis)
 let currentStreak = 1;
 for(let i=len-1; i>0; i--){
  if(arch[i] === arch[i-1]) currentStreak++;
  else break;
 }
 
 // เก็บสถิติมังกรที่เคยเกิดขึ้น
 streaksHistory = [];
 let tempS = 1;
 for(let i=1; i<len; i++){
  if(arch[i] === arch[i-1]) tempS++;
  else { if(tempS > 1) streaksHistory.push(tempS); tempS = 1; }
 }
 const avgStreak = streaksHistory.length > 0 ? (streaksHistory.reduce((a,b)=>a+b,0)/streaksHistory.length) : 2;
 const saturation = (currentStreak / (avgStreak + 1.5)) * 100;
 
 document.getElementById('sat-ui').innerText = "SATURATION: " + saturation.toFixed(0) + "%";
 document.getElementById('sat-ui').style.color = saturation > 85 ? "var(--r)" : "#555";

 // 2. วิเคราะห์ความมั่ว (Chaos Index)
 let switches = 0;
 const windowSize = 8;
 if(len >= windowSize){
  for(let i=len-1; i>len-windowSize; i--) if(arch[i] !== arch[i-1]) switches++;
 }
 const chaosIndex = (switches / (windowSize-1)) * 100;
 document.getElementById('chaos-ui').innerText = "CHAOS INDEX: " + chaosIndex.toFixed(0) + "%";
 document.getElementById('chaos-ui').style.color = chaosIndex > 75 ? "var(--r)" : "#555";

 // 3. การสแกนประวัติศาสตร์แบบ Zero-Speculation (95 Layers)
 let pW=0, bW=0, matchCount=0;
 let threshold = (streakL >= 2) ? 98 : (streakL === 1 ? 92 : 86);

 for(let d=2; d<=95; d++){
  if(len<d) break;
  const pat=arch.slice(-d).join('');
  const weight = Math.pow(d, 9.5);
  for(let i=0; i<len-d; i++){
   if(arch.slice(i, i+d).join('')===pat){
    const recency = Math.exp((i-len)/12); // Recency Weighting
    if(arch[i+d]==='P') pW+=(weight*recency); else bW+=(weight*recency);
    matchCount++;
   }
  }
 }

 const total=pW+bW;
 document.getElementById('recall-ui').innerText = "RECALL: " + matchCount;
 
 // เงื่อนไข: ไม่แม่นยำ/ไม่ตรงประวัติศาสตร์/มั่วเกินไป/มังกรอิ่มตัว -> WAIT
 if(total===0 || matchCount < 5 || chaosIndex > 85) return wait("UNCERTAIN/CHAOS");
 if(saturation > 100 && nextMove === arch[len-1]) return wait("SATURATION ALERT");

 const pP=(pW/total)*100, pB=(bW/total)*100, max=Math.max(pP,pB);
 const sig=document.getElementById('sig'), intel=document.getElementById('intel');

 if(max >= threshold){
  nextMove = pP>pB?'P':'B';
  sig.innerText = nextMove==='P'?'PLAYER':'BANKER';
  sig.style.color = nextMove==='P'?'var(--p)':'var(--b)';
  document.getElementById('prob').innerText = max.toFixed(1)+'%';
  
  if(streakL >= 2) {
   intel.innerText = "SLAYER MODE: 98% LOCK";
   intel.style.color = "var(--r)";
  } else {
   intel.innerText = saturation > 70 ? "BEWARE DRAGON END" : "STABLE PATTERN";
   intel.style.color = "var(--n)";
  }
 } else {
  wait("LOW CONFIDENCE");
 }
}

function wait(m){
 nextMove=null; document.getElementById('sig').innerText="WAIT";
 document.getElementById('sig').style.color="#111";
 document.getElementById('prob').innerText="---";
 document.getElementById('intel').innerText=m;
 document.getElementById('intel').style.color="#444";
}

function ui(){
 const b=document.getElementById('h-box');
 b.innerHTML=arch.map(v=>`<div class="node" style="background:${v==='P'?'var(--p)':'var(--b)'}">${v}</div>`).join('');
 b.scrollLeft=9999;
 document.getElementById('w-ui').innerText="WINS: "+wins; 
 document.getElementById('net-ui').innerText="NET: "+net;
}

function undo(){ if(arch.length>0){ arch.pop(); if(streakL>0) streakL--; ui(); engine(); } }
</script>
</body>
</html>
