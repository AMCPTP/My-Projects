<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ULTIMATE NEURAL SLAYER</title>
<style>
 :root { --p: #007aff; --b: #ff3b30; --n: #00fff2; --g: #ffcc00; --bg: #050505; --r: #ff0055; --w: #ffffff; }
 * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; font-family: 'JetBrains Mono', 'Courier New', sans-serif; }
 body { background: var(--bg); color: #fff; margin: 0; padding: 10px; overflow: hidden; }
 .shell { max-width: 420px; margin: auto; border: 1px solid #1a1a1a; border-radius: 40px; padding: 25px; background: #000; position: relative; box-shadow: 0 0 100px rgba(0, 255, 242, 0.05); }
 
 .monitor { text-align: center; border-bottom: 1px solid #111; padding-bottom: 15px; margin-bottom: 15px; }
 #sig { font-size: 80px; font-weight: 950; height: 100px; display: flex; align-items: center; justify-content: center; letter-spacing: -6px; }
 
 .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
 .metric-box { padding: 10px 5px; font-size: 8px; font-weight: 900; background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 12px; color: #444; }
 .val { display: block; font-size: 12px; color: #888; margin-top: 4px; }

 .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
 .btn-k { border: none; height: 110px; border-radius: 30px; font-size: 55px; font-weight: 950; color: #fff; cursor: pointer; border-bottom: 10px solid rgba(0,0,0,0.4); transition: 0.1s; }
 .btn-p { background: var(--p); } .btn-b { background: var(--b); }
 .btn-k:active { transform: translateY(4px); border-bottom-width: 2px; }

 .h-row { display: flex; gap: 6px; overflow-x: auto; padding: 15px 0; border-bottom: 1px solid #111; }
 .node { min-width: 32px; height: 32px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 950; border: 1px solid #222; }
 .system-logs { font-size: 10px; color: var(--g); text-align: center; margin-top: 15px; font-weight: bold; min-height: 15px; text-transform: uppercase; }
 .acc-tracker { display: flex; justify-content: space-between; margin-top: 15px; font-size: 11px; font-weight: 900; color: #333; }
</style>
</head>
<body>
<div class="shell">
 <div style="text-align:center; font-size:8px; color:#222; letter-spacing:10px; margin-bottom:15px;">NEURAL SLAYER PRO V.FINAL</div>
 
 <div class="monitor">
  <div class="metrics">
   <div class="metric-box">ACCURACY<span id="acc-v" class="val">--%</span></div>
   <div class="metric-box">ENTROPY<span id="ent-v" class="val">0.0</span></div>
   <div class="metric-box">SATURATION<span id="sat-v" class="val">0%</span></div>
  </div>
  <div id="sig" style="color:#111;">WAIT</div>
  <div id="prob" style="font-size:45px; font-weight:950; color:var(--n);">---</div>
  <div id="log" class="system-logs">INITIALIZING...</div>
 </div>

 <div class="btn-grid">
  <button class="btn-k btn-p" onpointerdown="cmd('P')">P</button>
  <button class="btn-k btn-b" onpointerdown="cmd('B')">B</button>
 </div>

 <div class="h-row" id="h-box"></div>

 <div class="acc-tracker">
  <span>W: <span id="w-ui" style="color:#fff">0</span></span>
  <span>L: <span id="l-ui" style="color:#fff">0</span></span>
  <span>NET: <span id="n-ui" style="color:var(--g)">0</span></span>
  <span>RECALL: <span id="r-ui" style="color:var(--n)">0</span></span>
 </div>
 
 <div style="display:flex; justify-content:space-between; margin-top:25px; font-size:10px; color:#222; font-weight:bold;">
  <span onclick="undo()" style="cursor:pointer; padding:5px;">UNDO</span>
  <span onclick="location.reload()" style="cursor:pointer; padding:5px; color:var(--r);">FORCE RESET</span>
 </div>
</div>

<script>
let arch=[]; let wins=0, loss=0, net=0, streakL=0, nextMove=null;
let selfTest = []; // เก็บประวัติการทายของระบบเอง

function cmd(s){
 if(nextMove){
  const isWin = nextMove===s;
  if(isWin){ wins++; net++; streakL=0; } else { loss++; net--; streakL++; }
  selfTest.push(isWin ? 1 : 0); if(selfTest.length > 10) selfTest.shift();
 }
 arch.push(s); ui(); engine();
}

function getStats(){
 const recent = selfTest.slice(-5);
 if(recent.length === 0) return 100;
 return (recent.reduce((a,b)=>a+b,0) / recent.length) * 100;
}

function engine(){
 const len=arch.length; if(len<8) return;
 const acc = getStats();
 document.getElementById('acc-v').innerText = acc.toFixed(0) + "%";
 document.getElementById('acc-v').style.color = acc < 40 ? "var(--r)" : "var(--n)";

 // 1. Entropy (ความมั่ว)
 let switches = 0;
 for(let i=len-1; i>len-8; i--) if(arch[i] !== arch[i-1]) switches++;
 const entropy = switches / 7;
 document.getElementById('ent-v').innerText = (entropy*100).toFixed(0) + "%";
 
 // 2. Saturation (มังกรอิ่มตัว)
 let curS=1; for(let i=len-1; i>0; i--){ if(arch[i]===arch[i-1]) curS++; else break; }
 let maxS=0, tempS=1;
 for(let i=1; i<len; i++){
  if(arch[i]===arch[i-1]) tempS++;
  else { maxS = Math.max(maxS, tempS); tempS = 1; }
 }
 const sat = (curS / (maxS || 2)) * 100;
 document.getElementById('sat-v').innerText = sat.toFixed(0) + "%";

 // 3. Deep Neural Scan (95 Layers + Recency Weight)
 let pW=0, bW=0, matches=0;
 let threshold = (streakL >= 2) ? 98 : (streakL === 1 ? 93 : 88);

 if(acc < 40) return wait("SELF-CORRECTING..."); // หยุดเมื่อระบบเริ่มไม่แม่น
 if(entropy > 0.85) return wait("HIGH CHAOS: STANDBY");

 for(let d=2; d<=95; d++){
  if(len<d) break;
  const pat = arch.slice(-d).join('');
  const weight = Math.pow(d, 9.5);
  for(let i=0; i<len-d; i++){
   if(arch.slice(i, i+d).join('') === pat){
    const recency = Math.exp((i-len)/15);
    if(arch[i+d]==='P') pW+=(weight*recency); else bW+=(weight*recency);
    matches++;
   }
  }
 }

 const total = pW + bW;
 document.getElementById('r-ui').innerText = matches;

 if(total===0 || matches < 5) return wait("NO MATCHING HISTORY");
 if(sat >= 100 && nextMove === arch[len-1] && streakL < 2) return wait("DRAGON WALL REACHED");

 const pP=(pW/total)*100, pB=(bW/total)*100, max=Math.max(pP,pB);
 const sig=document.getElementById('sig'), log=document.getElementById('log');

 if(max >= threshold){
  nextMove = pP > pB ? 'P' : 'B';
  sig.innerText = nextMove==='P' ? 'PLAYER' : 'BANKER';
  sig.style.color = nextMove==='P' ? 'var(--p)' : 'var(--b)';
  document.getElementById('prob').innerText = max.toFixed(1) + "%";
  log.innerText = streakL >= 2 ? "SLAYER LOCK ACTIVE" : (sat > 80 ? "FOLLOW WITH CAUTION" : "SIGNAL CONFIRMED");
  log.style.color = streakL >= 2 ? "var(--r)" : "var(--n)";
 } else {
  wait("LOW CONFIDENCE ("+max.toFixed(0)+"%)");
 }
}

function wait(m){
 nextMove=null; document.getElementById('sig').innerText="WAIT";
 document.getElementById('sig').style.color="#111";
 document.getElementById('prob').innerText="---";
 document.getElementById('log').innerText=m;
 document.getElementById('log').style.color="#444";
}

function ui(){
 const b=document.getElementById('h-box');
 b.innerHTML=arch.map(v=>`<div class="node" style="background:${v==='P'?'var(--p)':'var(--b)'}">${v}</div>`).join('');
 b.scrollLeft=9999;
 document.getElementById('w-ui').innerText=wins; 
 document.getElementById('l-ui').innerText=loss;
 document.getElementById('n-ui').innerText=net;
}

function undo(){ if(arch.length>0){ arch.pop(); if(streakL>0) streakL--; ui(); engine(); } }
</script>
</body>
</html>
